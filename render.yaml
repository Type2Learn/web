services:
  - type: web
    name: type2learn-web
    runtime: node
    buildCommand: npm ci && npm run verify
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # These flags are safe to keep in the public Blueprint: personalisation
      # still requires a signed-in learner, explicit adaptive consent, Firebase
      # and strict server-side validation before any compact summary is stored.
      - key: ADAPTIVE_LEARNING_ENABLED
        value: "true"
      - key: BEHAVIOUR_CONTEXT_ENABLED
        value: "true"
      - key: MASCOT_PARTNER_AI_ENABLED
        value: "true"
      - key: AI_ASSESSMENTS_ENABLED
        value: "true"
      # This enables the learner-controlled authored visual rail. Generative
      # images remain unavailable until a separately reviewed provider is added.
      - key: AI_VISUALS_ENABLED
        value: "true"
      # Guest Course AI is off by default. Enable it only after explicitly
      # accepting the public-preview quota and abuse trade-offs.
      - key: AI_ALLOW_GUESTS
        value: "false"
      # Public Firebase project metadata, not a credential. Firebase Admin
      # still needs its existing Render service account before private source
      # uploads can use this bucket.
      - key: FIREBASE_STORAGE_BUCKET
        value: type2learn-defcc.firebasestorage.app
